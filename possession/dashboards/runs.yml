name: Possession run'ları
description: Her run'ın skoru; yarışma maçlarında public pencerede, Metrica maçlarında maçın tamamında
connection: possession_read

filters:
  - name: run
    type: select
    default: ""
    options:
      query: SELECT DISTINCT run_name FROM degerlendirme.skorlar ORDER BY run_name
  - name: game
    type: select
    default: ""
    options:
      query: SELECT game FROM temiz.maclar WHERE graded ORDER BY dataset, game
  - name: timeline_minute
    type: number
    default: 0
    tab: Genel bakış

queries:
  selected:
    sql: |
      SELECT * FROM degerlendirme.skorlar
      WHERE game = coalesce(nullif('{{ filters.game }}', ''), (SELECT game FROM temiz.maclar WHERE graded ORDER BY dataset, game LIMIT 1))
        AND run_name = coalesce(nullif('{{ filters.run }}', ''),
                                (SELECT run_name FROM degerlendirme.skorlar ORDER BY created_at DESC LIMIT 1))

rows:
  - widgets:
      - name: Nasıl okunur
        type: text
        col: 12
        content: |
          **Modeli Metrica ortalamasına bakarak seçiyoruz.** Metrica 1 ve 2 iki tam maç, toplam ~665 possession var;
          etiketlerini olay verisinden kodla ürettik. Organizatörün dört baseline'ında gizli tam maç skoruyla aynı kazananı seçiyor.
          Yarışma maçında sadece public pencere puanlanıyor (BAR-ATH'ta 5 dakika, 17 possession); orası kontrol için, sıralama için değil.
          Metrica'nın etiket tanımı yarışmanınkiyle birebir aynı değil, o yüzden mutlak sayıya değil run'lar arasındaki farka bakıyoruz.

  - widgets:
      - name: Run ve maç başına spellF1
        type: table
        col: 12
        sql: |
          SELECT run_name,
                 avg(spell_f1_mean) FILTER (WHERE dataset = 'metrica sample') AS metrica_avg,
                 any_value(spell_f1_mean) FILTER (WHERE game = 'metrica_1') AS metrica_1,
                 any_value(spell_f1_mean) FILTER (WHERE game = 'metrica_2') AS metrica_2,
                 avg(spell_f1_mean) FILTER (WHERE dataset = 'competition') AS competition_public,
                 avg(macro_f1) FILTER (WHERE dataset = 'metrica sample') AS metrica_macro_f1,
                 avg(macro_f1) FILTER (WHERE dataset = 'competition') AS competition_macro_f1,
                 any_value(params) AS params,
                 max(created_at) AS created_at
          FROM degerlendirme.skorlar
          GROUP BY run_name
          ORDER BY metrica_avg DESC
        columns:
          - name: run_name
            frozen: true
          - name: metrica_avg
            label: Metrica ort. spellF1
            number: ".4f"
            format:
              - { backgroundColor: [red, white, green] }
          - name: metrica_1
            label: Metrica 1
            number: ".4f"
            format:
              - { backgroundColor: [red, white, green] }
          - name: metrica_2
            label: Metrica 2
            number: ".4f"
            format:
              - { backgroundColor: [red, white, green] }
          - name: competition_public
            label: Yarışma public pencere
            number: ".4f"
            format:
              - { backgroundColor: [red, white, green] }
          - name: metrica_macro_f1
            label: Metrica ort. macroF1
            number: ".4f"
          - name: competition_macro_f1
            label: Yarışma macroF1
            number: ".4f"

  - tab: Genel bakış
    widgets:
      - name: spellF1 (sıralama buna göre)
        type: metric
        col: 3
        query: selected
        value: { field: spell_f1_mean, type: number, format: ".4f" }
      - name: macroF1
        type: metric
        col: 3
        query: selected
        value: { field: macro_f1, type: number, format: ".4f" }
      - name: Tahmin ettiğimiz possession
        type: metric
        col: 3
        query: selected
        value: { field: poss, type: number, format: ",d" }
      - name: Gerçekteki possession
        type: metric
        col: 3
        query: selected
        value: { field: gt_poss, type: number, format: ",d" }

  - tab: Genel bakış
    widgets:
      - name: Seçili maç, bütün run'lar
        type: table
        col: 12
        sql: |
          SELECT run_name, spell_f1_mean, spell_bootstrap_low, spell_bootstrap_high, macro_f1,
                 poss, gt_poss, dur, gt_dur, accuracy, alive_dead_f1, f1_d, team_acc_gt_alive
          FROM degerlendirme.skorlar
          WHERE game = coalesce(nullif('{{ filters.game }}', ''), (SELECT game FROM temiz.maclar WHERE graded ORDER BY dataset, game LIMIT 1))
          ORDER BY spell_f1_mean DESC, macro_f1 DESC
        columns:
          - name: run_name
            frozen: true
          - name: spell_f1_mean
            label: spellF1
            number: ".4f"
            format:
              - { backgroundColor: [red, white, green] }
          - name: spell_bootstrap_low
            label: spellF1 5%
            number: ".3f"
          - name: spell_bootstrap_high
            label: spellF1 95%
            number: ".3f"
          - name: macro_f1
            label: macroF1
            number: ".4f"
          - name: dur
            label: ort. possession (sn)
            number: ".1f"
          - name: gt_dur
            label: gerçek ort. possession (sn)
            number: ".1f"
          - name: accuracy
            number: ".1%"
          - name: alive_dead_f1
            number: ".4f"
          - name: f1_d
            label: ölü top F1
            number: ".4f"
          - name: team_acc_gt_alive
            label: takım doğruluğu
            number: ".1%"

  - tab: Genel bakış
    widgets:
      - name: Zaman çizelgesi, gerçek ve seçili run (timeline_minute filtresinden itibaren 5 dakika)
        type: chart
        chart: vega-lite
        col: 12
        sql: |
          WITH start AS (
            SELECT min(start_frame) + {{ filters.timeline_minute }} * 1500 AS first_frame
            FROM degerlendirme.bloklar WHERE game = coalesce(nullif('{{ filters.game }}', ''), (SELECT game FROM temiz.maclar WHERE graded ORDER BY dataset, game LIMIT 1)) AND series = 'gt'
          )
          SELECT CASE series WHEN 'gt' THEN 'gerçek' ELSE run_name END AS source,
                 label,
                 greatest(start_frame, first_frame) / 25.0 AS start_s,
                 least(stop_frame, first_frame + 7500) / 25.0 AS end_s
          FROM degerlendirme.bloklar, start
          WHERE game = coalesce(nullif('{{ filters.game }}', ''), (SELECT game FROM temiz.maclar WHERE graded ORDER BY dataset, game LIMIT 1))
            AND run_name = coalesce(nullif('{{ filters.run }}', ''),
                                    (SELECT run_name FROM degerlendirme.skorlar ORDER BY created_at DESC LIMIT 1))
            AND stop_frame > first_frame AND start_frame < first_frame + 7500
          ORDER BY source, start_s
        spec:
          height: 120
          mark: { type: bar }
          encoding:
            y: { field: source, type: nominal, title: null, sort: ["gerçek"] }
            x: { field: start_s, type: quantitative, title: "video zamanı (sn)", scale: { zero: false } }
            x2: { field: end_s }
            color:
              field: label
              type: nominal
              scale: { domain: [H, A, D, X], range: ["#2563EB", "#DC2626", "#9CA3AF", "#111827"] }
            tooltip:
              - { field: source }
              - { field: label }
              - { field: start_s, title: başlangıç (sn) }
              - { field: end_s, title: bitiş (sn) }

  - tab: Genel bakış
    widgets:
      - name: Karışıklık matrisi (puanlanan frame'ler)
        type: pivot_table
        col: 6
        sql: |
          SELECT 'gerçek ' || gt AS truth, 'tahmin ' || pred AS pred, frames
          FROM degerlendirme.karisiklik
          WHERE game = coalesce(nullif('{{ filters.game }}', ''), (SELECT game FROM temiz.maclar WHERE graded ORDER BY dataset, game LIMIT 1))
            AND run_name = coalesce(nullif('{{ filters.run }}', ''),
                                    (SELECT run_name FROM degerlendirme.skorlar ORDER BY created_at DESC LIMIT 1))
        pivot:
          rows: [ { field: truth, showTotals: true } ]
          columns: [ { field: pred, showTotals: true } ]
          values:
            - field: frames
              summarize: sum
              format:
                - backgroundColor: ["#FFFFFF", "#60A5FA"]
      - name: IoU eşiğine göre spellF1
        type: chart
        chart: bar
        col: 6
        sql: |
          SELECT iou, f1 FROM (
            SELECT * FROM degerlendirme.skorlar
            WHERE game = coalesce(nullif('{{ filters.game }}', ''), (SELECT game FROM temiz.maclar WHERE graded ORDER BY dataset, game LIMIT 1))
              AND run_name = coalesce(nullif('{{ filters.run }}', ''),
                                      (SELECT run_name FROM degerlendirme.skorlar ORDER BY created_at DESC LIMIT 1))
          ) UNPIVOT (f1 FOR iou IN (spell_f1_iou_03 AS '0.3', spell_f1_iou_04 AS '0.4', spell_f1_iou_05 AS '0.5',
                                    spell_f1_iou_06 AS '0.6', spell_f1_iou_07 AS '0.7'))
          ORDER BY iou
        x: { field: iou, type: category }
        y: { field: [f1], type: number, format: ".2f", beginAtZero: true }

  - tab: Genel bakış
    widgets:
      - name: Dakika başına frame uyumu, seçili maç, bütün run'lar
        type: chart
        chart: line
        col: 12
        sql: |
          SELECT floor(frame / 1500) AS minute, run_name, avg((pred = gt)::INT) AS agreement
          FROM degerlendirme.kareler
          WHERE game = coalesce(nullif('{{ filters.game }}', ''), (SELECT game FROM temiz.maclar WHERE graded ORDER BY dataset, game LIMIT 1))
          GROUP BY ALL ORDER BY minute
        x: { field: minute, type: number }
        y: { field: [agreement], format: ".0%", beginAtZero: true }
        color: { field: run_name }

  - tab: Run detayı
    widgets:
      - name: Seçili run'ı üreten model
        type: table
        col: 12
        sql: |
          SELECT run_name, created_at, params, model_source
          FROM model.calistirmalar
          WHERE run_name = coalesce(nullif('{{ filters.run }}', ''),
                                    (SELECT run_name FROM degerlendirme.skorlar ORDER BY created_at DESC LIMIT 1))
