name: raw.games
type: duckdb.seed
description: Every competition game found in the data bundle, with its tactical frame count, frame rate and pitch size from its own tracking metadata.

parameters:
  path: ../../../data/csv/games.csv

columns:
  - name: game
    type: varchar
    checks:
      - name: not_null
      - name: unique
  - name: n_frames
    type: integer
  - name: fps
    type: double
  - name: pitch_length
    type: double
  - name: pitch_width
    type: double
  - name: has_broadcast
    type: boolean
