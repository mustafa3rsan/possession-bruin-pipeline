name: raw.metrica_ball
type: duckdb.seed
description: Ball position (0-1) per frame of the Metrica sample games; null where not tracked. No speed in the source.

parameters:
  path: ../../../../data/csv/metrica/ball.csv

columns:
  - name: game
    type: varchar
  - name: frame
    type: integer
    checks:
      - name: not_null
  - name: x
    type: double
  - name: y
    type: double
  - name: speed
    type: double
