name: raw.tracks
type: duckdb.seed
description: ATD track slots (tracklets, not people) and the team each belongs to.

parameters:
  path: ../../../data/csv/tracks.csv

columns:
  - name: game
    type: varchar
    checks:
      - name: not_null
  - name: source
    type: varchar
  - name: slot
    type: integer
  - name: player_id
    type: varchar
  - name: name
    type: varchar
  - name: shirt_number
    type: integer
  - name: team_id
    type: varchar
  - name: side
    type: varchar
    checks:
      - name: accepted_values
        value: [H, A]
