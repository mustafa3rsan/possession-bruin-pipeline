name: ham.metrica_top
type: duckdb.seed
description: "Metrica'nın açık iki maçında topun konumu. Bu maçları modelleri karşılaştırmak için test seti olarak kullanıyoruz. Hız bilgisi yok."

parameters:
  path: ../../../../data/csv/metrica/ball.csv

columns:
  - name: game
    type: varchar
  - name: frame
    type: integer
    checks:
      - name: not_null
  - name: x
    type: double
  - name: y
    type: double
  - name: speed
    type: double
