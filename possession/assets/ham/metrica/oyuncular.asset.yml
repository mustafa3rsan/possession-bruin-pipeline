name: ham.metrica_oyuncular
type: duckdb.seed
description: Player positions (0-1) per frame of the Metrica sample games, one row per observed player. No speed in the source.

parameters:
  path: ../../../../data/csv/metrica/players.csv

columns:
  - name: game
    type: varchar
  - name: frame
    type: integer
  - name: slot
    type: integer
  - name: x
    type: double
  - name: y
    type: double
  - name: speed
    type: double
