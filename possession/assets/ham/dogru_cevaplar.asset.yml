name: ham.dogru_cevaplar
type: duckdb.seed
description: "Organizatörün verdiği doğru cevaplar. Her frame için H (top ev sahibinde), A (deplasmanda), D (top ölü) ya da X (puanlanmıyor). BAR-ATH'ta sadece ilk 5 dakika dolu, gerisi X."

depends:
  - ham.maclar

parameters:
  path: ../../../data/csv/gt_public.csv

columns:
  - name: game
    type: varchar
    checks:
      - name: not_null
  - name: frame
    type: integer
    checks:
      - name: not_null
  - name: label
    type: varchar
    checks:
      - name: accepted_values
        value: [H, A, D, X]

custom_checks:
  - name: her maçta her frame için tam bir satır var
    query: |
      SELECT count(*) FROM (SELECT game, count(*) AS n, count(DISTINCT frame) AS d FROM ham.dogru_cevaplar GROUP BY game) t
      LEFT JOIN ham.maclar g USING (game)
      WHERE t.n IS DISTINCT FROM g.n_frames OR t.d <> g.n_frames
    value: 0
