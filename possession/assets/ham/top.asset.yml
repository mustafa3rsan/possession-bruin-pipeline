name: ham.top
type: duckdb.seed
description: "Her frame'de topun nerede olduğu ve hızı, iki kamera için ayrı ayrı (tactical ve broadcast). Konumlar 0-1 arası, metreye çevirmek için saha ölçüsüyle çarpıyoruz. Top görünmüyorsa boş."

depends:
  - ham.maclar

parameters:
  path: ../../../data/csv/ball.csv

columns:
  - name: game
    type: varchar
    checks:
      - name: not_null
  - name: source
    type: varchar
  - name: frame
    type: integer
    checks:
      - name: not_null
  - name: x
    type: double
  - name: y
    type: double
  - name: speed
    type: double

custom_checks:
  - name: her maçta tactical kamerada her frame için tam bir satır var
    query: |
      SELECT count(*) FROM ham.maclar g
      LEFT JOIN (SELECT game, count(*) AS n, count(DISTINCT frame) AS d FROM ham.top
                 WHERE source = 'tactical' GROUP BY game) b USING (game)
      WHERE b.n IS DISTINCT FROM g.n_frames OR b.d <> g.n_frames
    value: 0
