name: ham.slotlar
type: duckdb.seed
description: "Tracking'deki her slot kimin; oyuncu kimliği, adı, forma numarası ve takımı (H ev sahibi, A deplasman)."

parameters:
  path: ../../../data/csv/tracks.csv

columns:
  - name: game
    type: varchar
    checks:
      - name: not_null
  - name: source
    type: varchar
  - name: slot
    type: integer
  - name: player_id
    type: varchar
  - name: name
    type: varchar
  - name: shirt_number
    type: integer
  - name: team_id
    type: varchar
  - name: side
    type: varchar
    checks:
      - name: accepted_values
        value: [H, A]
