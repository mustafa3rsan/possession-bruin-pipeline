name: ham.maclar
type: duckdb.seed
description: "Veri paketinde bulduğumuz yarışma maçları. Her maçın kaç frame olduğu, fps'i ve saha ölçüsü maçın kendi tracking dosyasından geliyor. Broadcast videosu var mı onu da tutuyoruz."

parameters:
  path: ../../../data/csv/games.csv

columns:
  - name: game
    type: varchar
    checks:
      - name: not_null
      - name: unique
  - name: n_frames
    type: integer
  - name: fps
    type: double
  - name: pitch_length
    type: double
  - name: pitch_width
    type: double
  - name: has_broadcast
    type: boolean
