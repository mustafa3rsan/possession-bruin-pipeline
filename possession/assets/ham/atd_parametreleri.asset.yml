name: ham.atd_parametreleri
type: duckdb.seed
description: "Tracking dosyasının teknik ayarları olduğu gibi (saha ölçüsü, fps vs.). Şimdilik kullanmıyoruz, lazım olursa diye duruyor."

parameters:
  path: ../../../data/csv/atd_parameters.csv

columns:
  - name: game
    type: varchar
    checks:
      - name: not_null
  - name: source
    type: varchar
  - name: scope
    type: varchar
  - name: owner_id
    type: varchar
  - name: name
    type: varchar
  - name: value
    type: varchar
