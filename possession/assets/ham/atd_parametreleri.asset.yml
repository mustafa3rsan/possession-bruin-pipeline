name: ham.atd_parametreleri
type: duckdb.seed
description: Every provider parameter in the ATD metadata, plus field size and frame rate.

parameters:
  path: ../../../data/csv/atd_parameters.csv

columns:
  - name: game
    type: varchar
    checks:
      - name: not_null
  - name: source
    type: varchar
  - name: scope
    type: varchar
  - name: owner_id
    type: varchar
  - name: name
    type: varchar
  - name: value
    type: varchar
