name: ham.oyuncular
type: duckdb.seed
description: "Her frame'de takip edilen her oyuncunun konumu (0-1 arası) ve hızı. Bir satır, bir frame'deki bir slot."

parameters:
  path: ../../../data/csv/players.csv

columns:
  - name: game
    type: varchar
    checks:
      - name: not_null
  - name: source
    type: varchar
  - name: frame
    type: integer
  - name: slot
    type: integer
  - name: x
    type: double
  - name: y
    type: double
  - name: speed
    type: double
