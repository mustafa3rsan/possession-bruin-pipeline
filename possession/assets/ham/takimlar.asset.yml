name: ham.takimlar
type: duckdb.seed
description: "Maçtaki iki takım ve hangisi ev sahibi (H), hangisi deplasman (A). Şimdilik hiçbir yerde kullanmıyoruz."

parameters:
  path: ../../../data/csv/teams.csv

columns:
  - name: game
    type: varchar
    checks:
      - name: not_null
  - name: source
    type: varchar
  - name: team_id
    type: varchar
  - name: name
    type: varchar
  - name: side
    type: varchar
    checks:
      - name: accepted_values
        value: [H, A]
