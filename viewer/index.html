<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ball Viewer</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --line: #2a2f3a; --text: #e6e8ee; --muted: #8a92a3;
    --home: #3b82f6; --away: #ef4444; --ball: #facc15; --pitch: #14532d; --pitch-line: #d1fae5;
    --warn: #f97316;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 13px/1.4 -apple-system, system-ui, sans-serif; }
  header { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--line); }
  header h1 { font-size: 15px; margin: 0 8px 0 0; }
  .group { display: flex; gap: 6px; align-items: center; }
  button, select, input { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; font: inherit; }
  button:hover { border-color: var(--muted); cursor: pointer; }
  input[type=number] { width: 90px; }
  label { color: var(--muted); display: flex; gap: 4px; align-items: center; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px; }
  .card h2 { font-size: 12px; font-weight: 600; color: var(--muted); margin: 0 0 6px; text-transform: uppercase; letter-spacing: .04em; display: flex; justify-content: space-between; gap: 8px; }
  .stage { position: relative; width: 100%; aspect-ratio: 16 / 9; background: #000; }
  .stage video, .stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .stage canvas { pointer-events: none; }
  canvas.radar { width: 100%; height: auto; display: block; }
  .info { font-family: ui-monospace, Menlo, monospace; font-size: 12px; white-space: pre; color: var(--text); overflow-x: auto; }
  .warn { color: var(--warn); }
  .legend { display: flex; gap: 12px; color: var(--muted); font-size: 12px; margin-top: 6px; flex-wrap: wrap; }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 4px; vertical-align: -1px; }
  #status { color: var(--muted); }

  /* tek veri */
  #tek { display: flex; gap: 12px; padding: 12px 16px; align-items: flex-start; }
  #tek .left { flex: none; width: min(64vw, calc((100vh - var(--chrome, 180px)) * 16 / 18)); display: flex; flex-direction: column; gap: 12px; }
  #tek .right { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 12px; }
  @media (max-width: 900px) { #tek { flex-direction: column; } #tek .left { width: 100%; } }

  /* karşılaştırma: iki sütun, her sütunda radar, tactical, broadcast; ortada oynatma */
  #cift { display: none; padding: 10px 16px; gap: 10px; justify-content: center;
          grid-template-columns: var(--sutun, 420px) 112px var(--sutun, 420px); }
  body.karsilastirma #tek { display: none; }
  body.karsilastirma #cift { display: grid; }
  .sutun { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  .sutun-baslik { font-size: 13px; font-weight: 700; text-align: center; padding: 4px; border-radius: 6px; background: var(--panel); border: 1px solid var(--line); }
  .orta { position: sticky; top: 10px; align-self: start; display: flex; flex-direction: column; gap: 6px; padding-top: 34px; }
  .orta button { width: 100%; }
  .orta #play2 { font-size: 18px; padding: 10px 0; }
  .orta .sayac { text-align: center; color: var(--muted); font-size: 12px; white-space: pre-line; }
  #cift .info { grid-column: 1 / -1; }
</style>
</head>
<body>
<header>
  <h1>Ball Viewer</h1>
  <select id="game"></select>
  <label>veri <select id="veri" title="Gösterilen veri: ham ya da bir run'ın modele giren verisi"></select></label>
  <label>karşılaştır <select id="karsilastir" title="Yan sütunda gösterilecek ikinci veri"></select></label>
  <div class="group">
    <button id="play">▶ Oynat</button>
    <button data-step="-25">−1 s</button>
    <button data-step="-1">−1 f</button>
    <button data-step="1">+1 f</button>
    <button data-step="25">+1 s</button>
    <select id="rate">
      <option value="0.25">0.25×</option><option value="0.5">0.5×</option>
      <option value="1" selected>1×</option><option value="2">2×</option>
    </select>
  </div>
  <div class="group">
    <label>frame <input id="goFrame" type="number" min="0" step="1"></label>
    <label>dk <input id="goMinute" type="number" min="0" step="0.5" style="width:70px"></label>
    <button id="go">Git</button>
  </div>
  <div class="group">
    <label><input type="checkbox" id="ovBall" checked> top</label>
    <label><input type="checkbox" id="ovPlayers" checked> oyuncular</label>
    <label><input type="checkbox" id="ovTrail" checked> iz (1 s)</label>
    <label><input type="checkbox" id="link" checked> broadcast senkron</label>
  </div>
  <span id="status"></span>
</header>

<main id="tek">
  <div class="left">
    <div class="card">
      <h2><span>Tactical video <span class="katman"></span></span><span class="tacFrame"></span></h2>
      <div class="stage" id="tacYuvaTek">
        <video id="tac" preload="auto" muted playsinline></video>
        <canvas id="tacA" width="1920" height="1080"></canvas>
      </div>
    </div>
    <div class="card">
      <h2><span>Broadcast <span class="katman"></span></span><span class="brdFrame"></span></h2>
      <div class="stage" id="brdYuvaTek">
        <video id="brd" preload="auto" muted playsinline></video>
        <canvas id="brdA" width="1920" height="1080"></canvas>
      </div>
    </div>
  </div>
  <div class="right">
    <div class="card">
      <h2><span>Radar <span class="katman"></span></span></h2>
      <canvas class="radar" id="radarTek"></canvas>
      <div class="legend">
        <span><span class="dot" style="background:var(--home)"></span>Barcelona (H)</span>
        <span><span class="dot" style="background:var(--away)"></span>Athletic (A)</span>
        <span><span class="dot" style="background:var(--ball)"></span>top</span>
      </div>
      <div class="info" id="infoTek" style="margin-top:8px"></div>
    </div>
    <div class="card">
      <h2><span>Broadcast senkronu</span></h2>
      <span class="brdState legend" style="margin:0"></span>
      <div class="legend">Broadcast frame = tactical frame − offset (yarı başına, veriden hesaplandı). Tekrar ve yakın çekimde homography olmadığı için işaret çizilmez.</div>
    </div>
  </div>
</main>

<section id="cift">
  <div class="sutun">
    <div class="sutun-baslik" id="baslikA"></div>
    <div class="card"><h2><span>Radar</span></h2><canvas class="radar" id="radarA"></canvas></div>
    <div class="card"><h2><span>Tactical</span><span class="tacFrame"></span></h2><div class="stage" id="tacYuvaCift"></div></div>
    <div class="card"><h2><span>Broadcast</span><span class="brdFrame"></span></h2><div class="stage" id="brdYuvaCift"></div></div>
  </div>
  <div class="orta">
    <button id="play2">▶</button>
    <button data-step="-25">−1 s</button>
    <button data-step="-1">−1 f</button>
    <button data-step="1">+1 f</button>
    <button data-step="25">+1 s</button>
    <div class="sayac" id="sayac"></div>
    <div class="sayac brdState"></div>
  </div>
  <div class="sutun">
    <div class="sutun-baslik" id="baslikB"></div>
    <div class="card"><h2><span>Radar</span></h2><canvas class="radar" id="radarB"></canvas></div>
    <div class="card"><h2><span>Tactical</span><span class="tacFrame"></span></h2>
      <div class="stage"><canvas id="tacB" width="1920" height="1080"></canvas></div></div>
    <div class="card"><h2><span>Broadcast</span><span class="brdFrame"></span></h2>
      <div class="stage"><canvas id="brdB" width="1920" height="1080"></canvas></div></div>
  </div>
  <div class="card info" id="infoCift"></div>
</section>

<script>
let FPS = 25;
const CHUNK = 250, TRAIL = 25, MAX_CHUNKS = 40;
const $ = id => document.getElementById(id);
const all = sel => document.querySelectorAll(sel);
const tac = $('tac'), brd = $('brd');
const css = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();

let meta = null, frame = 0, brdFrame = 0;
const chunks = new Map(), pending = new Map();

function status(text) { $('status').textContent = text || ''; }

function indexLayer(d) {
  const ball = new Map(), players = new Map();
  if (!d) return { ball, players };
  d.ball.frame.forEach((f, k) => ball.set(f, { x: d.ball.x[k], y: d.ball.y[k] }));
  d.players.frame.forEach((f, k) => {
    if (!players.has(f)) players.set(f, []);
    players.get(f).push({ slot: d.players.slot[k], side: d.players.side[k], x: d.players.x[k], y: d.players.y[k] });
  });
  return { ball, players };
}

function indexChunk(d) {
  const hom = new Map();
  const h = d.homography;
  h.frame.forEach((f, k) => hom.set(f, {
    m: [h.h00[k], h.h01[k], h.h02[k], h.h10[k], h.h11[k], h.h12[k], h.h20[k], h.h21[k], h.h22[k]],
    err: h.reprojection_error[k], valid: h.valid[k] === 1,
  }));
  const bh = d.broadcast_homography, bhom = new Map();
  bh.frame.forEach((f, k) => bhom.set(f, {
    b: bh.broadcast_frame[k], valid: bh.valid[k] === 1,
    m: [bh.h00[k], bh.h01[k], bh.h02[k], bh.h10[k], bh.h11[k], bh.h12[k], bh.h20[k], bh.h21[k], bh.h22[k]],
  }));
  return { hom, bhom, A: indexLayer(d.shown), B: indexLayer(d.compared) };
}

function loadChunk(i) {
  if (i < 0 || (meta && i * CHUNK >= meta.n_frames)) return Promise.resolve(null);
  if (chunks.has(i)) return Promise.resolve(chunks.get(i));
  if (pending.has(i)) return pending.get(i);
  const p = fetch(`/api/window?game=${encodeURIComponent(meta.game)}&veri=${encodeURIComponent($('veri').value)}&karsilastir=${encodeURIComponent($('karsilastir').value)}&start=${i * CHUNK}&count=${CHUNK}`).then(r => r.json()).then(d => {
    pending.delete(i);
    if (d.error) { status(d.error); return null; }
    chunks.set(i, indexChunk(d));
    if (chunks.size > MAX_CHUNKS) {
      const far = [...chunks.keys()].sort((a, b) => Math.abs(b - i) - Math.abs(a - i))[0];
      chunks.delete(far);
    }
    render();
    return chunks.get(i);
  }).catch(e => { pending.delete(i); status('veri alınamadı: ' + e); return null; });
  pending.set(i, p);
  return p;
}

const chunkOf = f => chunks.get(Math.floor(f / CHUNK));
// One data set at one frame: which is 'A' (veri) or 'B' (karşılaştır).
function layerAt(f, which) {
  const c = chunkOf(f);
  if (!c) return null;
  return { ball: c[which].ball.get(f), players: c[which].players.get(f) || [] };
}

const comparing = () => $('karsilastir').value !== '';
const label = key => key === 'ham' ? 'ham veri' : `run ${key}`;

function project(m, x, y) {
  const d = m[6] * x + m[7] * y + m[8];
  return [(m[0] * x + m[1] * y + m[2]) / d, (m[3] * x + m[4] * y + m[5]) / d];
}

// Draws players and ball of one data set on a 1920x1080 canvas; a mirror canvas first copies the video frame.
function drawMarks(canvas, f, which, hom, video) {
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  if (video && video.readyState >= 2) ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
  const layer = f === null ? null : layerAt(f, which);
  if (!layer || !hom || !hom.valid) return;
  const m = hom.m;
  if ($('ovPlayers').checked) {
    ctx.lineWidth = 3;
    for (const p of layer.players) {
      const [px, py] = project(m, p.x, p.y);
      ctx.strokeStyle = p.side === 'H' ? css('--home') : css('--away');
      ctx.beginPath(); ctx.arc(px, py, 14, 0, Math.PI * 2); ctx.stroke();
    }
  }
  if ($('ovTrail').checked) drawTrail(ctx, f, which, (x, y) => project(m, x, y), 3);
  if ($('ovBall').checked && layer.ball && layer.ball.x !== null) {
    const [bx, by] = project(m, layer.ball.x, layer.ball.y);
    ctx.strokeStyle = css('--ball'); ctx.lineWidth = 4;
    ctx.beginPath(); ctx.arc(bx, by, 18, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(bx - 28, by); ctx.lineTo(bx - 20, by); ctx.moveTo(bx + 20, by); ctx.lineTo(bx + 28, by);
    ctx.moveTo(bx, by - 28); ctx.lineTo(bx, by - 20); ctx.moveTo(bx, by + 20); ctx.lineTo(bx, by + 28); ctx.stroke();
  }
}

function drawTrail(ctx, f, which, toPx, width) {
  ctx.strokeStyle = css('--ball'); ctx.lineWidth = width; ctx.globalAlpha = 0.6;
  ctx.beginPath();
  let open = false;
  for (let g = f - TRAIL; g <= f; g++) {
    const layer = layerAt(g, which);
    const b = layer && layer.ball;
    if (!b || b.x === null) { open = false; continue; }
    const [px, py] = toPx(b.x, b.y);
    if (open) ctx.lineTo(px, py); else ctx.moveTo(px, py);
    open = true;
  }
  ctx.stroke(); ctx.globalAlpha = 1;
}

const RADAR_MARGIN = 24;
function sizeRadar(canvas) {
  if (!meta || !canvas.clientWidth) return;
  const cssWidth = canvas.clientWidth, dpr = window.devicePixelRatio || 1;
  canvas.scale = (cssWidth - 2 * RADAR_MARGIN) / meta.pitch_length;
  const cssHeight = meta.pitch_width * canvas.scale + 2 * RADAR_MARGIN;
  canvas.width = cssWidth * dpr; canvas.height = cssHeight * dpr;
  canvas.style.height = cssHeight + 'px';
  canvas.getContext('2d').setTransform(dpr, 0, 0, dpr, 0, 0);
}

function drawRadar(canvas, f, which) {
  if (!meta || !canvas.scale) return;
  const ctx = canvas.getContext('2d'), s = canvas.scale, o = RADAR_MARGIN;
  const L = meta.pitch_length, W = meta.pitch_width;
  const m = (x, y) => [o + x * s, o + y * s];
  const toRadar = (x, y) => m(x * L, y * W);
  ctx.fillStyle = css('--pitch'); ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.strokeStyle = css('--pitch-line'); ctx.lineWidth = 1.5; ctx.globalAlpha = 0.7;
  const rect = (x, y, w, h) => { const [a, b] = m(x, y); ctx.strokeRect(a, b, w * s, h * s); };
  rect(0, 0, L, W);
  ctx.beginPath(); ctx.moveTo(...m(L / 2, 0)); ctx.lineTo(...m(L / 2, W)); ctx.stroke();
  ctx.beginPath(); ctx.arc(...m(L / 2, W / 2), 9.15 * s, 0, Math.PI * 2); ctx.stroke();
  for (const side of [0, 1]) {
    rect(side ? L - 16.5 : 0, W / 2 - 20.16, 16.5, 40.32);
    rect(side ? L - 5.5 : 0, W / 2 - 9.16, 5.5, 18.32);
    rect(side ? L : -1.5, W / 2 - 3.66, 1.5, 7.32);
    ctx.beginPath(); ctx.arc(...m(side ? L - 11 : 11, W / 2), 2, 0, Math.PI * 2); ctx.stroke();
  }
  ctx.globalAlpha = 1;
  const layer = layerAt(f, which);
  if (!layer) return;
  for (const p of layer.players) {
    const [px, py] = toRadar(p.x, p.y);
    ctx.fillStyle = p.side === 'H' ? css('--home') : css('--away');
    ctx.beginPath(); ctx.arc(px, py, 5, 0, Math.PI * 2); ctx.fill();
  }
  if ($('ovTrail').checked) drawTrail(ctx, f, which, toRadar, 1.5);
  const b = layer.ball;
  if (b && b.x !== null) {
    const [bx, by] = toRadar(b.x, b.y);
    ctx.fillStyle = css('--ball'); ctx.strokeStyle = '#000'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(bx, by, 4.5, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  }
}

// Slots that are only in one of the two data sets, or on a different team, at this frame.
function differences(a, b) {
  const shown = new Map(a.players.map(p => [p.slot, p]));
  const other = new Map(b.players.map(p => [p.slot, p]));
  const onlyB = [], onlyA = [], relabelled = [];
  for (const [slot, p] of other) {
    const s = shown.get(slot);
    if (!s) onlyB.push(`${p.side} slot ${slot}`);
    else if (s.side !== p.side) relabelled.push(`slot ${slot}: ${p.side} → ${s.side}`);
  }
  for (const [slot, p] of shown) if (!other.has(slot)) onlyA.push(`${p.side} slot ${slot}`);
  return { onlyA, onlyB, relabelled };
}

function infoText(f) {
  const t = f / FPS, mm = Math.floor(t / 60), ss = (t - mm * 60).toFixed(2).padStart(5, '0');
  const lines = [`frame ${f}   video ${mm}:${ss}`];
  const a = layerAt(f, 'A'), c = chunkOf(f);
  if (!a) return lines.concat('yükleniyor…').join('\n');
  const ballLine = b => !b ? 'satır yok' : b.x === null ? 'görünmüyor' : `x ${b.x}   y ${b.y}`;
  const count = list => `H ${list.filter(p => p.side === 'H').length}   A ${list.filter(p => p.side === 'A').length}`;
  lines.push(`${label($('veri').value)}: top ${ballLine(a.ball)}   oyuncu ${count(a.players)}`);
  if (comparing()) {
    const b = layerAt(f, 'B');
    lines.push(`${label($('karsilastir').value)}: top ${ballLine(b.ball)}   oyuncu ${count(b.players)}`);
    const { onlyA, onlyB, relabelled } = differences(a, b);
    const parts = [
      relabelled.length ? `takımı farklı: ${relabelled.join(', ')}` : '',
      onlyB.length ? `sadece ${label($('karsilastir').value)}'da: ${onlyB.join(', ')}` : '',
      onlyA.length ? `sadece ${label($('veri').value)}'da: ${onlyA.join(', ')}` : '',
    ].filter(Boolean);
    lines.push(parts.length ? `<span class="warn">fark (sağ → sol): ${parts.join('   ')}</span>` : 'bu frame\'de iki veri aynı');
  }
  const hom = c && c.hom.get(f);
  if (hom) lines.push(`homography: ${hom.valid ? 'geçerli' : 'YOK'}   reprojection_error ${hom.err}` + (hom.err > 2 ? '   <span class="warn">(yüksek)</span>' : ''));
  return lines.join('\n');
}

function broadcastHom() {
  if (!meta) return { f: null, hom: null };
  const part = meta.sync.find(p => brdFrame >= p.start && brdFrame <= p.end);
  const f = part ? brdFrame + part.offset : null;
  const c = f === null ? null : chunkOf(f);
  const bh = c && c.bhom.get(f);
  return { f, hom: bh && bh.b === brdFrame ? bh : null };
}

function drawBroadcast() {
  const { f, hom } = broadcastHom();
  drawMarks($('brdA'), f, 'A', hom);
  if (comparing()) drawMarks($('brdB'), f, 'B', hom, brd);
}

function render() {
  const c = chunkOf(frame), hom = c && c.hom.get(frame);
  all('.katman').forEach(el => { el.textContent = '· ' + label($('veri').value); });
  $('baslikA').textContent = label($('veri').value);
  $('baslikB').textContent = label($('karsilastir').value);
  drawMarks($('tacA'), frame, 'A', hom);
  drawBroadcast();
  if (comparing()) {
    drawMarks($('tacB'), frame, 'B', hom, tac);
    drawRadar($('radarA'), frame, 'A');
    drawRadar($('radarB'), frame, 'B');
    $('infoCift').innerHTML = infoText(frame);
  } else {
    drawRadar($('radarTek'), frame, 'A');
    $('infoTek').innerHTML = infoText(frame);
  }
  all('.tacFrame').forEach(el => { el.textContent = `frame ${frame}`; });
  const t = frame / FPS, mm = Math.floor(t / 60), ss = Math.floor(t - mm * 60);
  $('sayac').textContent = `frame ${frame}\n${mm}:${String(ss).padStart(2, '0')}`;
}

function setFrame(f, force) {
  if (!force && f === frame && chunks.has(Math.floor(f / CHUNK))) return;
  frame = f;
  const i = Math.floor(f / CHUNK);
  loadChunk(i); loadChunk(i + 1);
  if (f % CHUNK < TRAIL) loadChunk(i - 1);
  render();
  syncBroadcast();
}

function seek(f) {
  if (!meta) return;
  f = Math.max(0, Math.min(meta.n_frames - 1, Math.round(f)));
  tac.currentTime = (f + 0.5) / FPS;
  setFrame(f);
}

function broadcastFor(f) {
  for (const part of meta.sync) {
    const b = f - part.offset;
    if (b >= part.start && b <= part.end) return b;
  }
  return null;
}

const isLive = b => meta.broadcast_live.some(([a, z]) => b >= a && b <= z);
const setBrdState = html => all('.brdState').forEach(el => { el.innerHTML = html; });

function syncBroadcast(force) {
  if (!$('link').checked || !meta) return;
  const target = broadcastFor(frame);
  if (target === null) {
    setBrdState('<span class="warn">broadcast kaydında yok</span>');
    if (!brd.paused) brd.pause();
    return;
  }
  if (target < 0 || target >= meta.broadcast_frames) return;
  setBrdState(isLive(target) ? 'canlı plan' : '<span class="warn">tekrar / yakın çekim</span>');
  brd.playbackRate = tac.playbackRate;
  if (tac.paused !== brd.paused) tac.paused ? brd.pause() : brd.play();
  const tolerance = tac.paused ? 0 : 5;
  if (force || Math.abs(brdFrame - target) > tolerance) brd.currentTime = (target + 0.5) / FPS;
}

function watchFrames(video, onFrame) {
  if ('requestVideoFrameCallback' in HTMLVideoElement.prototype) {
    const cb = (now, md) => { onFrame(Math.round(md.mediaTime * FPS)); video.requestVideoFrameCallback(cb); };
    video.requestVideoFrameCallback(cb);
  } else {
    video.addEventListener('timeupdate', () => onFrame(Math.floor(video.currentTime * FPS)));
  }
}

watchFrames(tac, setFrame);
watchFrames(brd, f => { brdFrame = f; all('.brdFrame').forEach(el => { el.textContent = `frame ${f}`; }); drawBroadcast(); });

const togglePlay = () => tac.paused ? tac.play() : tac.pause();
$('play').onclick = togglePlay;
$('play2').onclick = togglePlay;
tac.addEventListener('play', () => { $('play').textContent = '❚❚ Durdur'; $('play2').textContent = '❚❚'; syncBroadcast(); });
tac.addEventListener('pause', () => { $('play').textContent = '▶ Oynat'; $('play2').textContent = '▶'; seek(frame); syncBroadcast(true); });
tac.addEventListener('seeked', render);
all('[data-step]').forEach(b => b.onclick = () => { tac.pause(); seek(frame + Number(b.dataset.step)); });
$('rate').onchange = () => { tac.playbackRate = Number($('rate').value); syncBroadcast(); };
$('go').onclick = () => {
  if ($('goFrame').value !== '') seek(Number($('goFrame').value));
  else if ($('goMinute').value !== '') seek(Number($('goMinute').value) * 60 * FPS);
  $('goFrame').value = ''; $('goMinute').value = '';
};
['ovBall', 'ovPlayers', 'ovTrail'].forEach(id => $(id).onchange = render);
$('link').onchange = () => syncBroadcast(true);

document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
  else if (e.code === 'ArrowRight') { tac.pause(); seek(frame + (e.shiftKey ? FPS : 1)); }
  else if (e.code === 'ArrowLeft') { tac.pause(); seek(frame - (e.shiftKey ? FPS : 1)); }
});

// Moves the two video elements into the layout of the current mode and sizes everything to fit the window.
function fitLayout() {
  const cift = comparing();
  document.body.classList.toggle('karsilastirma', cift);
  $(cift ? 'tacYuvaCift' : 'tacYuvaTek').prepend(tac);
  $(cift ? 'brdYuvaCift' : 'brdYuvaTek').prepend(brd);
  $(cift ? 'tacYuvaCift' : 'tacYuvaTek').append($('tacA'));
  $(cift ? 'brdYuvaCift' : 'brdYuvaTek').append($('brdA'));
  const header = document.querySelector('header').offsetHeight;
  if (cift && meta) {
    const ratio = meta.pitch_width / meta.pitch_length + 2 * 9 / 16;
    const byHeight = (window.innerHeight - header - 190) / ratio;
    const byWidth = (window.innerWidth - 32 - 112 - 20) / 2;
    document.documentElement.style.setProperty('--sutun', Math.max(260, Math.min(byHeight, byWidth)) + 'px');
    sizeRadar($('radarA')); sizeRadar($('radarB'));
  } else {
    const card = document.querySelector('#tek .left .card');
    const cardChrome = card.offsetHeight - card.querySelector('.stage').offsetHeight;
    document.documentElement.style.setProperty('--chrome', header + 24 + 12 + 2 * cardChrome + 4 + 'px');
    sizeRadar($('radarTek'));
  }
  render();
}
window.addEventListener('resize', fitLayout);

const query = new URLSearchParams(location.search);
fetch(`/api/meta?game=${encodeURIComponent(query.get('game') || '')}`).then(r => r.json()).then(m => {
  if (m.error) { status(m.error); return; }
  meta = m;
  FPS = m.fps;
  $('game').innerHTML = m.games.map(g => `<option${g === m.game ? ' selected' : ''}>${g}</option>`).join('');
  const options = ['ham', ...m.runs].map(k => `<option value="${k}">${label(k)}</option>`).join('');
  $('veri').innerHTML = options;
  $('karsilastir').innerHTML = '<option value="">yok</option>' + options;
  $('veri').value = query.get('veri') || m.runs[0] || 'ham';
  $('karsilastir').value = query.get('karsilastir') || '';
  const reload = () => {
    const params = new URLSearchParams({ game: $('game').value, veri: $('veri').value, karsilastir: $('karsilastir').value, frame });
    history.replaceState(null, '', '?' + params);
    chunks.clear(); pending.clear(); fitLayout(); setFrame(frame, true);
  };
  $('game').onchange = () => { location.search = '?game=' + encodeURIComponent($('game').value); };
  $('veri').onchange = reload;
  $('karsilastir').onchange = reload;
  const missing = Object.entries(m.videos).filter(([, ok]) => !ok).map(([s]) => s);
  if (missing.length) status(`video yok: ${missing.map(s => `data/videos/${s}/${m.game}_${s}.mp4`).join(', ')}`);
  tac.src = `/video/${encodeURIComponent(m.game)}/tactical`;
  brd.src = `/video/${encodeURIComponent(m.game)}/broadcast`;
  fitLayout();
  const start = Number(query.get('frame') || m.first_frame);
  tac.addEventListener('loadedmetadata', () => seek(start), { once: true });
  if (tac.readyState >= 1) seek(start);
  setFrame(start);
}).catch(e => status('sunucuya ulaşılamadı: ' + e));
</script>
</body>
</html>
